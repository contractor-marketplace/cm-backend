[workspace]
resolver = "2"
members = [
    "crates/cm-core",
    "crates/cm-db",
    "crates/cm-auth",
    "crates/cm-domain",
    "crates/cm-storage",
    "crates/cm-api",
    "crates/cm-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[workspace.dependencies]
cm-core = { path = "crates/cm-core" }
cm-db = { path = "crates/cm-db" }
cm-auth = { path = "crates/cm-auth" }
cm-domain = { path = "crates/cm-domain" }
cm-storage = { path = "crates/cm-storage" }
cm-api = { path = "crates/cm-api" }

argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
axum-core = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
getrandom = "0.3"
hmac = "0.12"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id", "catch-panic", "limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
