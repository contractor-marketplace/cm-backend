# Starting point for a 4 GB VPS shared with the API, the worker and Caddy.
# Revisit after measuring; these are a floor, not a conclusion.

listen_addresses = '127.0.0.1'      # never the public interface
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_connections = 50                 # the API pool defaults to 16
random_page_cost = 1.1               # SSD
effective_io_concurrency = 200

wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Anything slower than this is worth seeing before a user reports it.
log_min_duration_statement = 250ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# GiST and GIN indexes on contractors need this to be built promptly after a
# bulk import.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
